name: Feature Request
description: 提出新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述你的需求，以便我们评估和实现。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: "描述你遇到的问题或希望解决的需求"
      placeholder: "例如: 我希望能够..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望如何解决这个问题
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他解决方案

  - type: dropdown
    id: agent
    attributes:
      label: 相关 Agent
      description: 这个功能与哪些 Agent 相关？
      multiple: true
      options:
        - opencode
        - claude-code
        - codex
        - 所有 Agent
        - 无关
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他你认为有用的信息、截图或参考
